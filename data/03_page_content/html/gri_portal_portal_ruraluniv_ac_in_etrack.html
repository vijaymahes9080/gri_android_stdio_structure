    <body  style='background:url(https://portal.ruraluniv.ac.in/img/etrack_bg.jpg);'>
  
	<div class='container-fluid' >
		
       
      <div class="container">
          <header><b>THE GANDHIGRAM RURAL INSTITUTE</b></header>
          <img  width="100" height="60" src='https://portal.ruraluniv.ac.in/img/grilogo.png' class="img-responsive center-block"/>
          <br>
          <header><b>G-Track Login Form</b></header>
         <form action="https://portal.ruraluniv.ac.in/Etrack/ServiceLoginAuth" method='post'>
             <input type="hidden" id="base_url" value="https://portal.ruraluniv.ac.in/">
            <div class="input-field">
               <input name='uname' type="text" required>
               <label>Username</label>
            </div>
            <div class="input-field">
               <input name='pword' class="pswrd" type="password" required>
               <span class="show">SHOW</span>
               <label>Password</label>
            </div>
            <div class=''>
                           </div>
            <div class="button">
               <div class="inner"></div>
               <button><i class='glyphicon glyphicon-log-in'></i>&nbsp;LOGIN</button>
            </div>
           
         </form>
         <img  width="50" height="40" src='https://portal.ruraluniv.ac.in/img/griims.png' class="img-responsive center-block"/>
      </div>
      <div class='row' id="footerGRI">
    	<div class='col-lg-12 col-md-12 col-12'>
    	    <br><br>

    	</div>
    </div>

      <script>
         var input = document.querySelector('.pswrd');
         var show = document.querySelector('.show');
         show.addEventListener('click', active);
         function active(){
           if(input.type === "password"){
             input.type = "text";
             show.style.color = "#1DA1F2";
             show.textContent = "HIDE";
           }else{
             input.type = "password";
             show.textContent = "SHOW";
             show.style.color = "#111";
           }
         }
         
        
      </script>
