<script type="text/javascript">
$( document ).ready(function() {
    $('#finalsubmit').hide();
    $('#error').html(" ");

    $('#finalsubmit').on('click', function (e) {
        e.preventDefault();
        var atLeastOneIsChecked = $('#certificate:checkbox:checked').length > 0;
        if(atLeastOneIsChecked<0){
            $('#certificate').addClass('is-invalid');
            $('#certificate').parents('.form-group').find('#error').html("<p class='mt-3 text-danger'>Certificate is Required</p>");
        }
        $.ajax({
            type: "POST",
            url: "https://portal.ruraluniv.ac.in/Esanad/validate", 
            data: $("#frm").serialize(),
            dataType: "json",  
            success: function(data){
                        
                        if(data['success']!=1){
                            $('#exampleModalCenter').modal('toggle');
                            $('#exampleModalCenter').modal('hide');
                            $.each(data, function(key, value) {
                                if(value!=""){
                                    $('#' + key).addClass('is-invalid');
                                    $('#' + key).parents('.form-group').find('#error').html(value);
                                }
                            });
                        }else{
                            e.preventDefault();
                            $("#udf1").val(data.reg);
                            $("#udf4").val(data.reg);
                            $("#udf2").val(data.email);
                            $("#tid").val(data.id);
                            $("#udf3").val(data.mob);
                            $("#amount").val(data.amount);
                            $('#frm1').submit();
                        }
                      }
        });
    });

    $('#frm input').on('keyup', function () { 
        $(this).removeClass('is-invalid').addClass('is-valid');
        $(this).parents('.form-group').find('#error').html(" ");
    });
    
    $("#frm input[type='radio']").on('click', function () { 
        $(this).removeClass('is-invalid').addClass('is-valid');
        $(this).parents('.form-group').find('#error').html(" ");
    });
    $("#frm input[type='checkbox']").on('click', function () { 
        $(this).removeClass('is-invalid').addClass('is-valid');
        $(this).parents('.form-group').find('#error').html(" ");
    });
    $('#frm textarea').on('keyup', function () { 
        $(this).removeClass('is-invalid').addClass('is-valid');
        $(this).parents('.form-group').find('#error').html(" ");
    });
});
$('#form-submit-button').on('click', function () {
    var numberOfChecked = $('input:checkbox:checked').length;
    if(numberOfChecked>0){
        var t=numberOfChecked*1500;
        $('#msg').html("Your Application cost is : <span class='badge badge-danger'> "+t+" </span>");
        $('#finalsubmit').show();
    }else{
        $('#msg').html("No Certificate Selected");
        $('#finalsubmit').hide();
    }
    
       
});
